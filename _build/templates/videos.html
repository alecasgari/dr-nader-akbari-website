    <section class="page-hero vg-hero">
      <div class="wrap">
        <nav class="breadcrumb" aria-label="مسیر صفحه">
          <ol>
{{breadcrumb}}
          </ol>
        </nav>
        <p class="kicker">{{kicker}}</p>
        <h1>{{h1}}</h1>
        <p class="lead">{{lead}}</p>
      </div>
    </section>

{{watch}}
    <section class="vg-stage" aria-label="ویدیوهای آموزشی">
      <div class="wrap">
        <div class="vg-toolbar">
          <p class="vg-count">{{count}} ویدیو</p>
          <div class="vg-filters" role="group" aria-label="موضوع ویدیو">
{{filters}}
          </div>
        </div>
        <div class="vg-grid" id="vg-grid">
{{grid}}
        </div>
      </div>
    </section>

{{below}}

    <div class="vg-modal" id="vg-modal" hidden>
      <button type="button" class="vg-modal-backdrop" data-vg-close aria-label="بستن"></button>
      <div class="vg-modal-panel" role="dialog" aria-modal="true" aria-labelledby="vg-modal-title">
        <button type="button" class="vg-modal-close" data-vg-close aria-label="بستن">×</button>
        <div class="vg-modal-layout">
          <div class="vg-modal-player">
            <video id="vg-modal-video" controls playsinline controlslist="nodownload"></video>
          </div>
          <div class="vg-modal-copy">
            <div class="vg-share" data-vg-share>
              <span class="vg-share-label">اشتراک‌گذاری</span>
              <a class="vg-share-btn" data-share="telegram" target="_blank" rel="noopener" aria-label="تلگرام">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.5 3.6 18.9 20c-.2 1-1.2 1.4-2 .9l-5.3-4-2.6 2.5c-.3.3-.8.1-.9-.3L7 14.2 3.2 13c-1-.3-1-1.7.1-2l17.3-8.1c.9-.4 1.8.4 1.4 1.7zM9.7 13.7l.6 4.6 1.4-2.7 7.2-6.5-9.2 4.6z"/></svg>
              </a>
              <a class="vg-share-btn" data-share="whatsapp" target="_blank" rel="noopener" aria-label="واتساپ">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.84c0 1.74.46 3.44 1.33 4.94L2 22l5.37-1.4a10 10 0 0 0 4.67 1.15h.01c5.46 0 9.89-4.4 9.89-9.85C21.94 6.4 17.5 2 12.04 2m5.76 14.08c-.24.68-1.4 1.26-1.94 1.3-.5.04-1.13.06-1.82-.11-.42-.11-.96-.31-1.66-.61-2.92-1.26-4.82-4.2-4.97-4.4-.14-.19-1.18-1.57-1.18-3 0-1.41.74-2.11 1-2.4.24-.27.64-.39 1.02-.39h.73c.23 0 .55-.09.86.66.33.79 1.11 2.72 1.21 2.92.1.19.16.42.03.68-.13.27-.2.43-.4.66-.19.23-.42.51-.6.69-.19.19-.38.39-.16.76.22.37 1 1.64 2.14 2.66 1.47 1.31 2.71 1.72 3.1 1.91.38.19.61.16.84-.1.22-.25.97-1.13 1.23-1.52.26-.38.52-.32.88-.19.36.13 2.32 1.09 2.72 1.29.4.2.66.3.76.47.09.16.09.95-.15 1.63z"/></svg>
              </a>
              <button type="button" class="vg-share-btn" data-share="copy" aria-label="کپی لینک">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M9 9h9v11H9z"/><path fill="none" stroke="currentColor" stroke-width="2" d="M6 15H5V4h9v1"/></svg>
              </button>
            </div>
            <p class="vg-modal-kicker" id="vg-modal-kicker"></p>
            <h2 id="vg-modal-title"></h2>
            <div class="vg-modal-body" id="vg-modal-body"></div>
            <div class="vg-modal-links" id="vg-modal-links"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="application/json" id="vg-data">{{videos_json}}</script>
