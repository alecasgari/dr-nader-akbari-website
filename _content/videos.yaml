  body: |
    آبریزش شفاف و آبکی از **یک سمت بینی** را بسیاری از افراد با سرماخوردگی، سینوزیت یا آلرژی اشتباه می‌گیرند. اگر مایع رقیق و بی‌رنگ باشد، هنگام خم شدن به جلو بیشتر شود یا طعم شور یا فلزی در گلو حس شود، باید به **نشت مایع مغزی نخاعی از بینی (CSF rhinorrhea)** فکر کرد؛ نه فقط به حساسیت فصلی.

    ## نشت مایع مغزی نخاعی چیست؟

    مایع مغزی نخاعی مغز و نخاع را احاطه می‌کند. اگر در استخوان قاعده جمجمه یا پرده‌های مننژ شکاف ایجاد شود، این مایع می‌تواند وارد بینی شود. علل شایع شامل ضربه به سر، شکستگی قاعده جمجمه، جراحی قبلی بینی یا سینوس، افزایش فشار داخل جمجمه و ناهنجاری‌های مادرزادی مانند مننگوسل و انسفالوسل است.

    خطر اصلی باز ماندن این مسیر، ورود باکتری از بینی به فضای مغز و بروز **مننژیت** است. به همین دلیل آبریزش شفاف یک‌طرفه را نباید ماه‌ها با قطره و آنتی‌هیستامین نادیده گرفت.

    ## چه علائمی باید جدی گرفته شود؟

    ترشح زلال یک‌طرفه، افزایش آبریزش با خم شدن یا زور زدن، سردرد متغیر با تغییر وضعیت سر، گرفتگی بینی مقاوم و عفونت سینوسی تکرارشونده از نشانه‌های هشدار هستند. تشخیص با معاینه آندوسکوپیک، سی‌تی‌اسکن با تفکیک بالا، ام‌آرآی و در صورت نیاز آزمایش بتا-۲ ترانسفرین روی مایع خروجی انجام می‌شود.

    ## درمان؛ جراحی باز یا آندوسکوپی؟

    در گذشته ترمیم این نشت اغلب با کرانیوتومی و برش روی سر انجام می‌شد. امروز روش استاندارد در موارد مناسب، **ترمیم آندوسکوپیک قاعده جمجمه از راه بینی** است: بدون برش صورت، با دیدن محل پارگی و مهروموم چندلایه با بافت خود بیمار. این رویکرد با جراحی آندوسکوپی سینوس هم‌خانواده است و دوره نقاهت معمولاً کوتاه‌تر از جراحی باز است.

    اگر آبریزش شفاف یک‌طرفه دارید، به‌ویژه بعد از ضربه یا عمل سینوس، ارزیابی توسط فلوشیپ راینولوژی و قاعده جمجمه لازم است. در این ویدیو روند تشخیص و ترمیم آندوسکوپیک را می‌بینید؛ جزئیات جراحی را در صفحه [جراحی آندوسکوپی سینوس](/جراحی-آندوسکوپی-سینوس/) بخوانید.

