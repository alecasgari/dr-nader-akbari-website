  body: 'بسیاری از افراد هنگام تجربه درد در ناحیه گوش، مستقیماً به دنبال عفونت، جرم
    یا آسیب‌های پرده گوش می‌گردند؛ اما در موارد متعددی، معاینات دقیق نشان می‌دهد که
