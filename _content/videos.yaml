    **پولیپ بینی** گوشت اضافه سرطانی نیست؛ کیسه‌های نرم مخاط ملتهب است که در سینوزیت مزمن و پولیپوز رشد می‌کند و راه تنفس را می‌بندد. بسیاری آن را با انحراف تیغه یا آلرژی فصلی اشتباه می‌گیرند. علائم شاخص: گرفتگی دائمی، کاهش یا از دست رفتن بویایی، ترشح پشت حلق، فشار صورت و خروپف.

    ## چرا پولیپ ایجاد می‌شود؟

    زمینه التهابی، آسم، حساسیت به آسپرین (سندرم سامتر) و نقص تنظیم ایمنی مخاط در پولیپوز شایع است. دارو (اسپری کورتون بینی و در موارد انتخابی داروهای بیولوژیک) ممکن است حجم پولیپ را کم کند؛ اما پولیپ انسدادی گسترده معمولاً با دارو به‌تنهایی باز نمی‌شود.

    ## جراحی پولیپ بینی یعنی چه؟

    روش استاندارد **جراحی آندوسکوپی عملکردی سینوس (FESS)** است: از راه بینی، بدون برش صورت، پولیپ و بافت ملتهب برداشته می‌شود و دهانه سینوس‌ها برای تهویه باز می‌گردد. هدف تنفس، شانس برگشت بویایی و اثر بهتر دارو بعد از عمل است؛ نه «کندن یک‌بار برای همیشه»، چون بیماری ماهیت عودکننده دارد.

    ## بعد از عمل چه کار کنیم که برنگردد؟

    شستشوی منظم بینی، ادامه اسپری طبق نظر پزشک و پیگیری آندوسکوپیک جلوی عود زودرس را می‌گیرد. توضیح کامل بیماری، تشخیص و درمان در صفحه [پولیپ بینی](/پولیپ-بینی/) آمده است؛ جزئیات عمل را در [جراحی آندوسکوپی سینوس](/جراحی-آندوسکوپی-سینوس/) بخوانید.

    این ویدیو برای جستجوهایی مثل «پولیپ بینی چیست»، «درمان پولیپ بینی» و «جراحی پولیپ» ساخته شده تا تصویر واقعی از بیماری و مسیر درمان را ببینید.
