    ## علائم سینوس چرکی پیشانی

    درد و فشار پیشانی، ترشح زرد یا سبز از بینی یا حلق، کاهش بویایی و گرفتگی بینی شایع‌اند. مجاورت این سینوس با کاسه چشم و قاعده جمجمه یعنی عفونت درمان‌نشده می‌تواند به سمت چشم یا مغز گسترش یابد. به همین دلیل سینوزیت فرونتال مقاوم را نباید فقط با مسکن ادامه داد.

    ## دارو کی کافی است و عمل کی لازم است؟

    در فاز حاد، درمان دارویی و گاهی آنتی‌بیوتیک مناسب اولین گام است. اگر بیماری مزمن شود، پولیپ یا انحراف مسیر را ببندد، یا تصویربرداری چرک محبوس نشان دهد، **جراحی آندوسکوپی سینوس** مطرح می‌شود. تفاوت زمان دارو و جراحی را در [سینوزیت مزمن](/سینوزیت-مزمن/) ببینید.

    ## دسترسی مستقیم آندوسکوپیک به سینوس پیشانی

    در تکنیک‌های نوین می‌توان از راه بینی، بدون برش روی پیشانی یا ابرو، به دهانه سینوس فرونتال رسید و کانون التهاب را تخلیه کرد؛ بدون دستکاری بی‌مورد سینوس‌های سالم اطراف. هدف تهویه مجدد سینوس و کاهش عود است، نه برداشتن گسترده استخوان صورت.

    اگر سردرد پیشانی مقاوم و ترشح پشت حلق دارید، سی‌تی‌اسکن و آندوسکوپی تشخیصی قدم بعدی است. مسیر عمل را در [جراحی آندوسکوپی سینوس](/جراحی-آندوسکوپی-سینوس/) بخوانید.

