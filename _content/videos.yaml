  body: |
    **سینوزیت چرکی** و عفونت مکرر سینوس همیشه فقط یک عفونت ساده مخاط نیست. اگر ماه‌ها آنتی‌بیوتیک مصرف می‌کنید و گرفتگی، ترشح و درد برمی‌گردد، باید علت‌های پنهان‌تر را هم بررسی کرد: نقص استخوان قاعده جمجمه، **مننگوسل** یا **نشت مایع مغزی نخاعی**. در این حالت مسیر بین بینی و مغز باز می‌ماند و خطر مننژیت بالا می‌رود.

    ## سینوزیت مقاوم چه زمانی زنگ خطر است؟

    آبریزش آبکی یک‌طرفه، طعم شور در حلق، سردرد وضعیتی، درد فشاری سینوس و عفونت‌هایی که با دارو تمام نمی‌شوند باید فراتر از تشخیص «سینوزیت مزمن معمولی» دیده شوند. سینوزیت شدید درمان‌نشده، ضربه، جراحی قبلی بینی یا ناهنجاری مادرزادی کف جمجمه می‌تواند زمینه این تصویر را بسازد.

    ## تشخیص درست قبل از عمل

    سی‌تی‌اسکن با وضوح بالا و ام‌آرآی کمک می‌کند کانون چرک، پولیپ، انسداد دهانه سینوس و هم‌زمان نقص قاعده جمجمه مشخص شود. بدون این نقشه، جراحی ناقص یا تکرار آنتی‌بیوتیک کافی نیست. تفاوت سینوزیت حاد، مزمن و موارد نیازمند عمل را در صفحه [سینوزیت مزمن](/سینوزیت-مزمن/) بخوانید.

    ## جراحی همزمان عفونت و ترمیم نشت

    با **جراحی آندوسکوپی عملکردی سینوس (FESS)** می‌توان سینوس‌های درگیر را پاکسازی کرد و در همان مسیر، مننگوسل را ترمیم و سوراخ قاعده جمجمه را با بافت پیوندی بیمار مهروموم کرد؛ بدون برش صورت. هدف هم قطع چرخه عفونت است هم بستن راه ورود باکتری به مغز.

    این ویدیو برای کسانی است که سینوزیت چرکی مقاوم دارند و می‌خواهند بدانند آیا مشکل فقط سینوس است یا قاعده جمجمه هم درگیر است. مسیر عمل را در [جراحی آندوسکوپی سینوس](/جراحی-آندوسکوپی-سینوس/) دنبال کنید.

