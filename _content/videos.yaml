    ## مننگوسل چه فرقی با سینوزیت دارد؟

    در سینوزیت معمول ترشحات اغلب غلیظ‌ترند و دو طرفه یا متناوب‌اند. در مننگوسل و نشت مایع مغزی، مایع معمولاً زلال، آبکی و یک‌طرفه است و با خم شدن افزایش می‌یابد. طعم شور در گلو و سردرد وضعیتی هم شایع است. تشخیص فقط با نگاه به ظاهر بینی ممکن نیست؛ سی‌تی‌اسکن با تفکیک بالا و ام‌آرآی اختصاصی قاعده جمجمه لازم است.

    ## چرا تشخیص دیر می‌شود؟

    نقص استخوانی ممکن است مادرزادی، ناشی از افزایش فشار داخل جمجمه، ضربه یا جراحی قبلی باشد و در معاینه اولیه دیده نشود. تا وقتی تصویربرداری هدفمند انجام نشود، آنتی‌بیوتیک‌های مکرر فقط علائم عفونت را موقتاً کم می‌کنند و مسیر نشت را نمی‌بندند.

    ## درمان آندوسکوپیک مننگوسل

    روش انتخابی در بیشتر موارد بزرگسالان، **جراحی آندوسکوپی قاعده جمجمه از راه بینی** است: اصلاح بافت فتق‌یافته و بازسازی چندلایه محل نقص، بدون برش روی صورت. این کار با جراحی آندوسکوپی سینوس هم‌مسیر است و جای زخم خارجی ندارد.

    بیمار این ویدیو پس از ماه‌ها آبریزش و بررسی‌های بی‌نتیجه، مننگوسل پنهان داشت و با ترمیم آندوسکوپیک درمان شد. اگر آبریزش زلال طولانی دارید، صفحه [جراحی آندوسکوپی سینوس](/جراحی-آندوسکوپی-سینوس/) و معاینه تخصصی قاعده جمجمه را جدی بگیرید.

