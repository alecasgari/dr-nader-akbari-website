    درد ارجاعی گوش (Referred Otalgia) شناخته می‌شود؛ حالتی که در آن منشأ اصلی التهاب
    یا بیماری در بخش دیگری از سر، گردن یا گلو قرار دارد، اما به دلیل اشتراک مسیرهای
    عصبی حسی، پیام درد به عنوان درد گوش درک می‌شود.


    یکی از علل مهم و کمتر شناخته‌شده درد ارجاعی گوش، بیماری‌ها و التهاب‌های غده تیروئید—به‌ویژه
    تیروئیدیت تحت‌حاد (Subacute Thyroiditis)—است. غده تیروئید در قسمت جلوی گردن قرار
    دارد و در زمان التهاب یا عفونت می‌تواند دردی تیز، مبهم یا ضربان‌دار ایجاد کند
    که به سمت زاویه فک، گردن و مستقیماً داخل یک یا هر دو گوش انتشار می‌یابد. بسیاری
    از بیماران به اشتباه ماه‌ها برای درمان عفونت گوش یا سینوزیت دارو مصرف می‌کنند،
    در حالی که منشأ درد، واکنش التهابی در بافت تیروئید است.


    علاوه بر مشکلات تیروئید، عوامل شایع دیگری نیز می‌توانند باعث بروز دردهای راجعه
    به گوش شوند؛ از جمله سینوزیت‌های عفونی و حاد، اختلالات مفصل گیجگاهی-فکی (TMJ)،
    دندان‌درد یا دندان عقل نهفته، رفلاکس معده و التهاب لوزه‌ها. مسیرهای عصبی جمجمه‌ای
    مانند عصب واگ، عصب گلوسوفارنژیال و اعصاب حسی گردنی این نواحی را به گوش پیوند می‌دهند
    و تحریک هر یک از این شاخه‌ها می‌تواند دردی گمراه‌کننده در گوش ایجاد کند که ارتباطی
    با ساختار فیزیکی گوش ندارد.


    تشخیص دقیق علت درد گوش مقاوم به درمان، نیازمند یک بررسی جامع سر و گردن توسط متخصص
    گوش، حلق، بینی و سر و گردن است. ارزیابی دقیق تیروئید با معاینه فیزیکی، آزمایش‌های
    هورمونی و سونوگرافی، در کنار بررسی آندوسکوپیک سینوس‌ها و حنجره، کمک می‌کند تا
    ریشه اصلی درد به درستی شناسایی شده و بیمار از مصرف بی‌رویه آنتی‌بیوتیک‌ها و قطره‌های
    گوشی بی‌اثر رهایی یابد. اگر شما نیز از درد مبهم یا تیرکشنده در گوش رنج می‌برید
    که با معاینات معمول گوش دلیلی برای آن یافت نشده، بررسی سلامت تیروئید و نواحی اطراف
    گردن اقدامی ضروری خواهد بود.'
